# App 2 ports (keep separate from App 1's 3000/8000):
#   Frontend → http://localhost:3001
#   API      → http://localhost:8001
services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    env_file:
      - ./backend/.env
    volumes:
      - leads_data:/data
    environment:
      LEADS_DB_PATH: /data/leads.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  leads_data:
